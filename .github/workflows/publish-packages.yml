name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer derives the version from tag history

      # Same composite action ci.yml runs: build with warnings as errors, vulnerability
      # scan, unit + architecture tests, and the per-assembly coverage gate. Packing from
      # the same job and checkout guarantees the bits pushed are the bits tested.
      #
      # Emulator-backed integration tests are not run here — this job starts no Cosmos
      # emulator. They gate every pull request via ci.yml instead.
      - uses: ./.github/actions/build-and-test

      - name: Pack
        run: dotnet pack FrontierPlatform.slnx -c Release --no-build -o ./artifacts

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
