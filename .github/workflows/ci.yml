name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Doc-only fast path: if a change touches nothing but markdown, docs/ or .claude/,
  # the build/test jobs are skipped entirely. `ci-gate` below is what makes this safe
  # to combine with a required status check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" || true)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/.*|\.claude/.*|.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Commit subjects must be "<scope>: Imperative summary" ("<scope>!:" for a public API break).
  # With lockstep versioning the log between two tags is the only input to the release
  # decision, so the scope and the "!" marker are load-bearing, not cosmetic.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a pull request this validates the branch commits AND the PR title. The title is
      # not cosmetic: this repo squash-merges, so the PR title becomes the subject of the
      # commit that actually lands on main. Validating only the branch commits leaves the
      # one subject that reaches main unchecked — which is exactly how a non-conforming
      # subject reached main at v0.2.0, after the branch commits were renamed and the title
      # was not.
      #
      # A Dependabot PR is checked on its title alone: its branch commits cannot be renamed
      # without a force-push, and the title (retitled by hand when it misses) is what lands.
      - name: Validate commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            subjects=""
            if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
              subjects=$(git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.sha }}")
            fi
            # Checked with the " (#N)" GitHub appends on squash, so the 72-character limit is
            # applied to the subject as it will actually land — a title that is exactly 72
            # would otherwise pass here and overflow on main.
            subjects=$(printf '%s\n%s (#%s)' "$subjects" "$PR_TITLE" "$PR_NUMBER")
          else
            subjects=$(git log -1 --format=%s)
          fi
          export COMMIT_SUBJECTS="$subjects"
          bash .github/scripts/validate-commit-messages.sh

  # Unit + architecture tests and the per-assembly coverage gate, via the same composite
  # action the publish workflow uses — a tag build is held to exactly this bar.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer walks tag history

      - uses: ./.github/actions/build-and-test

  # Integration tests ([Trait("Category","Integration")]) against a bare Cosmos emulator and,
  # for the orchestration replay suite, the Durable Task Scheduler emulator (S13.192).
  # No provisioning step: every integration fixture calls CreateDatabaseIfNotExistsAsync and
  # tears its own database down, so there is no cosmos-init equivalent to run here.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # S13.192: the one hub the DTS emulator serves and the replay suite connects to, named once so
    # the container and the tests cannot drift apart.
    env:
      DTS_EMULATOR_TASKHUB: frontier-platform-replay
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build FrontierPlatform.slnx -c Release -warnaserror

      # vnext-preview emulator — plain HTTP, dramatically lighter than the :latest image,
      # which crashed (ExitCode 1) on 2-CPU runners. Started via `docker run` rather than
      # `services:` so we can poll readiness with a real data-plane request (an /_explorer
      # probe passes while the data plane is still dead).
      - name: Start Cosmos DB emulator (vnext-preview)
        run: |
          docker run -d --name cosmos-emulator -p 8081:8081 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview \
            --protocol http

      - name: Wait for Cosmos DB emulator (data-plane gate)
        run: |
          # A bare `curl -s` exits 0 on ANY completed HTTP response, including 503 — the
          # exact false-positive this gate was written to replace. Require a non-503 status
          # specifically; the emulator's HTTP listener comes up well before its data-plane
          # engine finishes initializing.
          #
          # `curl -w "%{http_code}"` already prints "000" on its own when the request never
          # got a response (connection refused/reset). An earlier version of this gate ALSO
          # appended `|| echo "000"` on top of that, so a failed curl produced the literal
          # string "000000", which passed the `!= "000"` check as if it were a real status
          # and made the gate false-positive again.
          #
          # GitHub Actions runs `run:` blocks under `bash -e`: `code=$(cmd)` still trips
          # errexit when `cmd` exits non-zero (curl does, e.g. exit 56/CURLE_RECV_ERROR, on
          # a bare connection reset), aborting the whole step before the loop even gets to
          # retry — removing the old `|| echo "000"` reintroduced exactly that. `|| true`
          # suppresses the abort without printing anything extra to stdout; `${code:-000}`
          # then covers the case where curl produced no output at all.
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ 2>/dev/null || true)
            code="${code:-000}"
            if [ "$code" != "000" ] && [ "$code" != "503" ]; then
              echo "Cosmos DB emulator data plane is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for Cosmos DB emulator... ($i/36, last status: $code)"
            sleep 5
          done
          echo "::error::Cosmos DB emulator did not become ready in time"
          docker logs cosmos-emulator
          exit 1

      # S13.192: the Durable Task Scheduler emulator, for the orchestration replay suite
      # (GraphOrchestratorReplayTests), which runs GraphOrchestrator on a real worker so history is
      # actually replayed. Pinned by DIGEST, never a floating tag: the same digest frontier-workflow
      # pins in its ci.yml, AppHost and START_DEV.md (its DtsEmulatorDigestParityTests keeps those
      # equal), so both repos replay against one scheduler build. Bump deliberately, in both repos.
      # Database__TaskHubNames__0 configures exactly ONE hub (a second sends this image into a crash
      # loop), and neither worker nor client creates a missing hub, so it is the job-level
      # DTS_EMULATOR_TASKHUB the tests also read.
      - name: Start Durable Task Scheduler emulator (pinned by digest)
        run: |
          docker run -d --name dts-emulator -p 8080:8080 -p 8082:8082 \
            -e Database__TaskHubNames__0="$DTS_EMULATOR_TASKHUB" \
            mcr.microsoft.com/dts/dts-emulator@sha256:361323065a608d605f9d3ae56b854eb11f1c47fcc16845a37f948f03ca9c5fac

      # Readiness from the dashboard's /health on 8082, not the gRPC port: 8080 answers plain HTTP
      # with 400 as soon as the listener binds, the same false positive the Cosmos gate above
      # describes. `|| true` and ${code:-000} as in that gate.
      - name: Wait for Durable Task Scheduler emulator
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/health 2>/dev/null || true)
            code="${code:-000}"
            if [ "$code" = "200" ]; then
              echo "Durable Task Scheduler emulator is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for DTS emulator... ($i/36, last status: $code)"
            sleep 5
          done
          echo "::error::Durable Task Scheduler emulator did not become ready in time"
          docker logs dts-emulator
          exit 1

      # Per test project, collecting coverage (S13.193): coverlet must not run solution-wide (parallel
      # runs corrupt its per-assembly attribution, see build-and-test), and the loop over tests/*/
      # rather than a hardcoded list is what keeps a newly added suite covered.
      - name: Run integration tests with coverage (per project)
        shell: bash
        env:
          COSMOS_EMULATOR_ENDPOINT: http://localhost:8081
          DTS_EMULATOR_ENDPOINT: http://localhost:8080
        # Every project runs even after one fails, so one red suite does not hide the rest (or their
        # coverage); the step still fails if any did.
        run: |
          rm -rf ./coverage-integration
          failed=()
          for proj in tests/*/; do
            compgen -G "${proj}*.csproj" > /dev/null || continue
            dotnet test "$proj" -c Release --no-build \
              --filter "Category=Integration&Category!=RequiresAzureKeyVault" \
              --collect:"XPlat Code Coverage" --settings coverlet.runsettings \
              --results-directory ./coverage-integration || failed+=("$proj")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Integration tests failed in: ${failed[*]}"
            exit 1
          fi

      # Reported beside the unit gate, never gating (S13.193): threshold 0 and continue-on-error, and
      # if: always() so the table appears when the test step above failed. It
      # measures what the integration suite reaches outside [ExcludeFromCodeCoverage] — coverlet
      # always honours that attribute, so the excluded SDK glue itself stays unmeasured here too.
      - name: Report integration coverage (per assembly, not gated)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          report=$(python3 .github/scripts/coverage_by_assembly.py ./coverage-integration 0 2>&1) \
            || echo "::warning::Integration coverage could not be reported (no reports collected?)"
          echo "$report"
          {
            echo "### Integration coverage (report only, not gated)"
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump DTS emulator logs on failure
        if: failure()
        run: docker logs --tail 200 dts-emulator || true

      # "Connection refused" partway through the suite suggests the emulator container died
      # mid-run (e.g. OOM on a 2-CPU runner). Capture exit state, logs and kernel OOM activity.
      - name: Dump Cosmos emulator state on failure
        if: failure()
        run: |
          echo "::group::docker inspect cosmos-emulator"
          docker inspect cosmos-emulator --format='{{json .State}}' || true
          echo "::endgroup::"
          echo "::group::docker logs cosmos-emulator (last 200 lines)"
          docker logs --tail 200 cosmos-emulator || true
          echo "::endgroup::"
          echo "::group::dmesg OOM check"
          dmesg | grep -i -E "killed process|out of memory" || echo "no OOM entries found"
          echo "::endgroup::"

  # Proves packaging stays healthy on every PR, not just on a tag.
  pack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer stamps the version from tag history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build FrontierPlatform.slnx -c Release -warnaserror

      - run: dotnet pack FrontierPlatform.slnx -c Release --no-build -o ./artifacts

      # The count is deliberately exact rather than a lower bound: it fails on a package
      # silently dropped from the pack *and* on one arriving unannounced. Adding a library is
      # meant to touch this line — that is the point of it.
      - name: Verify all thirteen packages were produced
        run: |
          expected=13
          count=$(find ./artifacts -name '*.nupkg' | wc -l)
          echo "Packages produced: $count"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Expected $expected packages, got $count"
            find ./artifacts -name '*.nupkg' -print
            exit 1
          fi

      # Restores the packed .nupkg files from ./artifacts and compiles against them, which
      # is the only way to catch what packing cannot: a dependency missing from a nuspec, a
      # type that is internal but needed, or a registration extension unreachable from
      # outside its assembly. Does no I/O — no emulator, network or key required.
      - name: Smoke-test the packages as a consumer would
        working-directory: samples/Frontier.Platform.SmokeConsumer
        run: dotnet run -c Release

  # Single required status check — see the frontier-workflow twin of this job.
  # Always runs, so the check is always reported; passes when every upstream job
  # either succeeded or was skipped by the doc-only filter. Requiring the test jobs
  # directly would leave a docs-only PR pending forever.
  ci-gate:
    if: always()
    needs: [changes, commit-lint, test, integration, pack]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job did not succeed (result: $result)"; exit 1;;
            esac
          done
          echo "All required jobs succeeded or were legitimately skipped."
