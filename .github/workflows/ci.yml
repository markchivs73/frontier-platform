name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Doc-only fast path: if a change touches nothing but markdown, docs/ or .claude/,
  # the build/test jobs are skipped entirely. `ci-gate` below is what makes this safe
  # to combine with a required status check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" || true)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/.*|\.claude/.*|.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Commit subjects must be "<scope>: Imperative summary" ("<scope>!:" for a public API break).
  # With lockstep versioning the log between two tags is the only input to the release
  # decision, so the scope and the "!" marker are load-bearing, not cosmetic.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            subjects=$(git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.sha }}")
          else
            subjects=$(git log -1 --format=%s)
          fi
          export COMMIT_SUBJECTS="$subjects"
          bash .github/scripts/validate-commit-messages.sh

  # Unit + architecture tests and the per-assembly coverage gate, via the same composite
  # action the publish workflow uses — a tag build is held to exactly this bar.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer walks tag history

      - uses: ./.github/actions/build-and-test

  # Integration tests ([Trait("Category","Integration")]) against a bare Cosmos emulator.
  # No provisioning step: every integration fixture calls CreateDatabaseIfNotExistsAsync and
  # tears its own database down, so there is no cosmos-init equivalent to run here.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build FrontierPlatform.slnx -c Release -warnaserror

      # vnext-preview emulator — plain HTTP, dramatically lighter than the :latest image,
      # which crashed (ExitCode 1) on 2-CPU runners. Started via `docker run` rather than
      # `services:` so we can poll readiness with a real data-plane request (an /_explorer
      # probe passes while the data plane is still dead).
      - name: Start Cosmos DB emulator (vnext-preview)
        run: |
          docker run -d --name cosmos-emulator -p 8081:8081 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview \
            --protocol http

      - name: Wait for Cosmos DB emulator (data-plane gate)
        run: |
          # A bare `curl -s` exits 0 on ANY completed HTTP response, including 503 — the
          # exact false-positive this gate was written to replace. Require a non-503 status
          # specifically; the emulator's HTTP listener comes up well before its data-plane
          # engine finishes initializing.
          #
          # `curl -w "%{http_code}"` already prints "000" on its own when the request never
          # got a response (connection refused/reset). An earlier version of this gate ALSO
          # appended `|| echo "000"` on top of that, so a failed curl produced the literal
          # string "000000", which passed the `!= "000"` check as if it were a real status
          # and made the gate false-positive again.
          #
          # GitHub Actions runs `run:` blocks under `bash -e`: `code=$(cmd)` still trips
          # errexit when `cmd` exits non-zero (curl does, e.g. exit 56/CURLE_RECV_ERROR, on
          # a bare connection reset), aborting the whole step before the loop even gets to
          # retry — removing the old `|| echo "000"` reintroduced exactly that. `|| true`
          # suppresses the abort without printing anything extra to stdout; `${code:-000}`
          # then covers the case where curl produced no output at all.
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ 2>/dev/null || true)
            code="${code:-000}"
            if [ "$code" != "000" ] && [ "$code" != "503" ]; then
              echo "Cosmos DB emulator data plane is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for Cosmos DB emulator... ($i/36, last status: $code)"
            sleep 5
          done
          echo "::error::Cosmos DB emulator did not become ready in time"
          docker logs cosmos-emulator
          exit 1

      # Solution-wide, deliberately: no coverage is collected here, so the per-project rule
      # does not apply, and a hardcoded project list is what silently stops covering a new
      # suite when someone adds one.
      - name: Run integration tests
        env:
          COSMOS_EMULATOR_ENDPOINT: http://localhost:8081
        run: >-
          dotnet test FrontierPlatform.slnx -c Release --no-build
          --filter "Category=Integration"

      # "Connection refused" partway through the suite suggests the emulator container died
      # mid-run (e.g. OOM on a 2-CPU runner). Capture exit state, logs and kernel OOM activity.
      - name: Dump Cosmos emulator state on failure
        if: failure()
        run: |
          echo "::group::docker inspect cosmos-emulator"
          docker inspect cosmos-emulator --format='{{json .State}}' || true
          echo "::endgroup::"
          echo "::group::docker logs cosmos-emulator (last 200 lines)"
          docker logs --tail 200 cosmos-emulator || true
          echo "::endgroup::"
          echo "::group::dmesg OOM check"
          dmesg | grep -i -E "killed process|out of memory" || echo "no OOM entries found"
          echo "::endgroup::"

  # Proves packaging stays healthy on every PR, not just on a tag.
  pack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer stamps the version from tag history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build FrontierPlatform.slnx -c Release -warnaserror

      - run: dotnet pack FrontierPlatform.slnx -c Release --no-build -o ./artifacts

      # The count is deliberately exact rather than a lower bound: it fails on a package
      # silently dropped from the pack *and* on one arriving unannounced. Adding a library is
      # meant to touch this line — that is the point of it.
      - name: Verify all ten packages were produced
        run: |
          expected=10
          count=$(find ./artifacts -name '*.nupkg' | wc -l)
          echo "Packages produced: $count"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Expected $expected packages, got $count"
            find ./artifacts -name '*.nupkg' -print
            exit 1
          fi

      # Restores the packed .nupkg files from ./artifacts and compiles against them, which
      # is the only way to catch what packing cannot: a dependency missing from a nuspec, a
      # type that is internal but needed, or a registration extension unreachable from
      # outside its assembly. Does no I/O — no emulator, network or key required.
      - name: Smoke-test the packages as a consumer would
        working-directory: samples/Frontier.Platform.SmokeConsumer
        run: dotnet run -c Release

  # Single required status check — see the frontier-workflow twin of this job.
  # Always runs, so the check is always reported; passes when every upstream job
  # either succeeded or was skipped by the doc-only filter. Requiring the test jobs
  # directly would leave a docs-only PR pending forever.
  ci-gate:
    if: always()
    needs: [changes, commit-lint, test, integration, pack]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job did not succeed (result: $result)"; exit 1;;
            esac
          done
          echo "All required jobs succeeded or were legitimately skipped."
